    locale: zh-CN
    weight: 4
    title: Hextra
    params:
      page:
        contextMenu:
          links:
            - name: 在 ChatGPT 中打开
              icon: chatgpt
              url: "https://chatgpt.com/?hints=search&q=%E6%88%91%E6%AD%A3%E5%9C%A8%E9%98%85%E8%AF%BB%E8%BF%99%E4%B8%AA%E6%96%87%E6%A1%A3%3A+{url}%0A%E5%B8%AE%E6%88%91%E7%90%86%E8%A7%A3%E5%A6%82%E4%BD%95%E4%BD%BF%E7%94%A8%E5%AE%83%E3%80%82"

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: versions
      name: Versions
      weight: 5
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 2
    - identifier: more
      name: More
      weight: 4
    - identifier: showcase
      name: Showcase
      pageRef: /showcase
      weight: 3
      params:
        type: link
        icon: collection
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/imfing/hextra"
      params:
        icon: github
    - identifier: development
      name: Development ↗
      url: https://imfing.github.io/hextra/versions/latest/
      parent: versions
      params:
        type: link
        icon: beaker
    - identifier: v0.10
      name: v0.10 ↗
      url: https://imfing.github.io/hextra/versions/v0.10/
      parent: versions
    - identifier: v0.11
      name: v0.11 ↗
      url: https://imfing.github.io/hextra/versions/v0.11/
      parent: versions
    - identifier: about
      name: About
      pageRef: /about
      parent: more
      weight: 1
    - identifier: archives
      name: Archives
      pageRef: /archives
      parent: more
      weight: 2
    - identifier: glossary
      name: Glossary
      pageRef: /glossary
      parent: more
      weight: 3

  # Left identity rail on blog pages. Entries with a label become navigation
  # rows; entries with only params.icon become the social links row.
  blog:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
      params:
        type: link
        icon: home
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 2
      params:
        type: link
        icon: newspaper
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 3
      params:
        type: link
        icon: book-open
    - identifier: archives
      name: Archives
      pageRef: /archives
      weight: 4
      params:
        type: link
        icon: clock
    - identifier: about
      name: About
      pageRef: /about
      weight: 5
      params:
        type: link
        icon: user-circle
    - name: GitHub
      url: "https://github.com/imfing/hextra"
      weight: 10
      params:
        icon: github
    - name: RSS
      url: /blog/index.xml
      weight: 11
      params:
        icon: rss

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: about
      name: "About"
      pageRef: "/about"
      weight: 2
    - identifier: hugoDocs
      name: "Hugo Docs ↗"
      url: "https://gohugo.io/documentation/"
      weight: 3

params:
  description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.

  # Google Fonts Configuration
  fonts:
    # Enable Google Fonts integration
    enable: true
    # Heading font configuration
    heading:
      family: "Sora"
      axes: "wght@100..800"
      display: "swap"
    # Body font configuration
    body:
      family: "Mozilla Text"
      axes: "wght@200..700"
      display: "swap"
    # Code block font configuration
    code:
      family: "Google Sans Code"
      axes: "ital,wght@0,300;1,300"
      display: "swap"
    
    # Fallback fonts (used if Google Fonts fail to load)
    fallbacks:
      heading: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      body: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      code: "ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace"
  externalLinkDecoration: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      # width: 40
      # height: 20
      # link: /
    width: wide

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Display the author name of the last modified date
  displayUpdatedAuthor: false

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra/edit/main/docs/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 20
      # Post cards with a cover image, reading time and excerpt.
      # Remove this block to fall back to the plain list.
      card:
        enable: true
        cover: true
        readingTime: true

    article:
      displayPagination: true
      cover: true
      readingTime: true
      tags: true
      share:
        links:
          - name: X
            icon: x-twitter
            url: "https://x.com/intent/tweet?url={url}&text={title}"
          - name: LinkedIn
            icon: linkedin
            url: "https://www.linkedin.com/sharing/share-offsite/?url={url}"
          - name: Bluesky
            icon: bluesky
            url: "https://bsky.app/intent/compose?text={title}%20{url}"
      related:
        count: 3

    # Left identity rail. Links come from the `blog` menu above; every element
    # below renders only when its key is present.
    rail:
      onArticle: false
      profile:
        avatar: images/space.jpg
        name: Hextra
        tagline: Notes, release announcements and guides from the Hextra project.
      sponsor:
        title: Support Hextra
        text: Hextra is built in the open, with no ads and no trackers.
        url: "https://github.com/sponsors/imfing"
        label: Become a sponsor →
        icon: heart

    # Right rail sections, rendered in this order.
    widgets:
      recent:
        count: 5
      pinned:
        count: 3
      tags:
        count: 12

  archives:
    # Source section used for the archives page.
    section: blog
    # Date format for archive list items.
    dateFormat: "Jan 02"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: wide
    tabs:
      sync: true
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."

  imageZoom:
    enable: true

  comments:
    enable: false
    type: giscus

    # https://giscus.app/
    giscus:
      repo: imfing/hextra
      repoId: R_kgDOJ9fJag
      category: General
      categoryId: DIC_kwDOJ9fJas4CY7gW
      # mapping: pathname
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      # inputPosition: top
      # lang: en
      # theme: noborder_dark
