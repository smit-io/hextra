# Maps code block filenames and languages to icons shown in the filename bar.
#
# Resolution order: explicit `icon` attribute on the code fence, then the
# filename extension (`extensions`), then the fence language (`languages`).
# Values are icon names resolved by the `utils/icon` partial, so they can
# reference icons bundled in `data/icons.yaml` or any remote provider
# (e.g. `iconify:<set>/<icon>` for any set on https://icon-sets.iconify.design).
#
# Sites can extend or override these maps by creating their own
# `data/codeblock-icons.yaml`.

extensions:
  js: iconify:vscode-icons/file-type-js-official
  mjs: iconify:vscode-icons/file-type-js-official
  cjs: iconify:vscode-icons/file-type-js-official
